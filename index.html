<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
<main class="container mt-4 flex-grow-1">
  <section id="busqueda" class="row">
    <div class="container mt-5">
      <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-4 bg-white p-4 rounded shadow">
          <h4 class="text-center mb-3">Buscar Personajes de Dragon Ball</h4>
          <form id="searchForm" class="d-flex">
            <input type="text" id="characterName" class="form-control me-2" placeholder="Buscar Personajes">
            <button type="submit" class="btn btn-primary">Buscar</button>
          </form>
          <button type="button" id="verTodos" class="btn btn-secondary mt-3 w-100">Ver todos</button>
        </div>
      </div>
    </div>
  </section>
  <section id="resultados" class="container mt-5">
    <div id="results" class="row g-4 justify-content-center"></div>
  </section>
  <div class="modal fade" id="personajeModal" tabindex="-1" aria-labelledby="personajeModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-warning text-dark">
        <h5 class="modal-title" id="personajeModalLabel">Detalles del Personaje</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
</main>
</body>
  <footer class="text-white text-center py-3">
    © 2025 - ⚡ ¡Gracias por visitar el universo Dragon Ball! ⚡
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
  <script src="/assets/js/script.js"></script>
</body>
</html>
